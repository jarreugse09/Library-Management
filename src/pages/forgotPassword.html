<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - LibraLink</title>
    <link rel="stylesheet" href="/styles/modern-base.css" />
    <link rel="stylesheet" href="/styles/styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="left">
        <div class="logo-container animate-fade-in-up">
          <img class="logo" src="/images/LibraLinkLogo.png" alt="LibraLink Logo" />
          <h1 class="logo-tagline">Password Recovery</h1>
        </div>
      </div>

      <div class="right">
        <div class="container animate-scale-in">
          <div class="auth-header">
            <h2 class="heading-2">Forgot Password?</h2>
            <p class="text-muted">Enter your email to receive a reset link</p>
          </div>
          
          <form id="forgot-password-form" class="auth-form">
            <div class="input-group">
              <label for="email" class="input-label">Email Address</label>
              <input
                type="email"
                class="input"
                placeholder="your.email@example.com"
                name="email"
                id="email"
                required
              />
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-full" id="submit">
              <span>Send Reset Link</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
            
            <button type="button" class="btn btn-secondary btn-lg w-full" id="cancel">
              <span>Cancel</span>
            </button>
          </form>
          
          <div class="auth-footer">
            <p class="text-muted text-center mt-6">
              Remember your password?
              <a href="/" class="auth-link-primary">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="/scripts/forgotPassword.js"></script>
  </body>
</html>
