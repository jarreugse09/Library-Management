<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibraLink - Your Library</title>
    <link rel="stylesheet" href="/styles/modern-base.css" />
    <link rel="stylesheet" href="/styles/header-modern.css" />
    <link rel="stylesheet" href="/styles/userPage-modern.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
    </script>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a href="/userPage" class="logo">
          <img src="../images/LibraLinkLogo.png" alt="LibraLink" />
          <h1>LibraLink</h1>
        </a>
        
        <div class="search-wrapper">
          <input id="search" type="text" placeholder="Search books, authors, genres..." />
        </div>
        
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>
        
        <nav id="mainNav">
          <ul>
            <li><a href="/userPage" id="Browse" class="active">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              Browse
            </a></li>
            <li><a href="/userPage" id="myBooks">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
              </svg>
              My Books
            </a></li>
            <li class="dropdown">
              <button id="settingsToggle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"></path>
                </svg>
                Settings 
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </button>
              <ul class="dropdown-menu" id="settingsDropdown">
                <li id="clerkBtn" style="display: none">
                  <a href="/clerkPage/">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                      <line x1="9" y1="9" x2="15" y2="9"></line>
                      <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    Clerk Page
                  </a>
                </li>
                <li id="adminBtn" style="display: none">
                  <a href="/adminPage/">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                      <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    Admin Page
                  </a>
                </li>
                <li>
                  <a href="/userPage/account">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Account
                  </a>
                </li>
                <li>
                  <a href="/userPage/donateForm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    Donate
                  </a>
                </li>
                <li>
                  <a href="/borrowForm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                      <polyline points="14 2 14 8 20 8"></polyline>
                      <line x1="12" y1="18" x2="12" y2="12"></line>
                      <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    Borrow
                  </a>
                </li>
                <li>
                  <button id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                      <polyline points="16 17 21 12 16 7"></polyline>
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                  </button>
                </li>
              </ul>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <!-- Changed from div to main -->
      <aside class="genre" style="display: none">
        <!-- Changed from div to aside -->
        <h2>Genres</h2>
        <ul id="genreList"></ul>
      </aside>
      <aside class="sidebar" id="sidebar">
        <h2>My Books</h2>
        <ul id="sidebarList">
          <li><a id="currentBookBtn" href="">Currently Reading</a></li>
          <li><a id="donatedBtn" href="">Donated Books</a></li>
          <li><a id="savedBookBtn" href="">Saved Books</a></li>
        </ul>
      </aside>
      <!--USER DONATED BOOKS -->
      <section class="books">
        <!-- Changed from div to section -->

        <div class="book-list" id="myBookList">
          <!-- Book items will be dynamically added here -->
        </div>
        <!-- Modal for viewing PDF -->
      </section>
      <section id="pdfModal" class="pdfModal" style="display: none">
        <div class="pdf-header">
          <button id="prevPage">◀</button>
          <span id="pageNum"></span> / <span id="pageCount"></span>
          <button id="nextPage">▶</button>
          <button id="closePdfModal">Close</button>
        </div>
        <canvas id="pdfCanvas"></canvas>
      </section>

      <!-- BROWSE SECTION -->
      <section class="browse" style="display: none">
        <!-- Changed from div to section -->
        <h2>Browse</h2>
        <button id="physicalBtn">Physical Books</button>
        <button id="ebookBtn">E-Books</button>
        <div class="book-list" id="browseList">
          <!-- Book items will be dynamically added here -->
        </div>
      </section>

      <aside class="book-info">
        <!-- Changed from div to aside -->
        <button class="exit-btn" id="closeBookInfo">✕</button>
        <!-- Changed class to match CSS -->
        <h2>Book Information</h2>
        <div class="book-details" id="bookDetails">
          <!-- Book details will be dynamically added here -->
        </div>
        <div class="book-actions">
          <button id="readNowBtn" type="button">Read Now</button>
          <button id="addToLibrary" type="button">Add to Library</button>
          <button id="removeToLibrary" type="button">Remove</button>
        </div>
      </aside>
    </main>

    <script src="../scripts/header.js"></script>
    <script src="../scripts/userPage.js"></script>
  </body>
</html>
