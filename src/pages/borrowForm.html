<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrow a Book - LibraLink</title>
    <link rel="stylesheet" href="/styles/modern-base.css" />
    <link rel="stylesheet" href="/styles/header-modern.css" />
    <link rel="stylesheet" href="/styles/borrowForm.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a href="/userpage" class="logo">
          <img src="../images/LibraLinkLogo.png" alt="LibraLink" />
          <h1>LibraLink</h1>
        </a>

        <button class="mobile-menu-toggle" id="mobileMenuToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="mainNav">
          <ul>
            <li><a href="/userpage" id="Browse">Browse</a></li>
            <li><a href="/userpage" id="myBooks">My Books</a></li>
            <li class="dropdown">
              <button id="settingsToggle">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"></path>
                </svg>
                Settings
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </button>
              <ul class="dropdown-menu" id="settingsDropdown">
                <li id="clerkBtn" style="display: none">
                  <a href="/clerkPage/">Clerk Page</a>
                </li>
                <li id="adminBtn" style="display: none">
                  <a href="/adminPage/">Admin Page</a>
                </li>
                <li><a href="/userpage/account">Account</a></li>
                <li><a href="/userpage/donateForm">Donate</a></li>
                <li><a href="/borrowForm">Borrow</a></li>
                <li><button id="logoutBtn">Logout</button></li>
              </ul>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="container">
      <form id="borrowForm">
        <h2>Borrow a Physical Book</h2>

        <label for="bookTitle">Book Title</label>
        <select id="bookTitle" name="bookId" required>
          <option value="">Select book title</option>
        </select>

        <label for="borrowerName">Your Full Name</label>
        <input type="text" id="borrowerName" name="borrowerName" readonly />

        <label for="contactInfo">Contact Information</label>
        <input type="text" id="contactInfo" name="contactInfo" readonly />

        <label for="borrowDate">Borrow Date</label>
        <input type="date" id="borrowDate" name="borrowDate" required />

        <label for="returnDate">Expected Return Date</label>
        <input type="date" id="returnDate" name="returnDate" required />

        <label for="notes">Additional Notes (optional)</label>
        <textarea
          id="notes"
          name="notes"
          rows="4"
          placeholder="Any special instructions or requests..."
        ></textarea>

        <button type="submit">Submit Request</button>
      </form>
    </div>
    <script src="/scripts/header.js"></script>
    <script src="/scripts/borrowForm.js"></script>
  </body>
</html>
