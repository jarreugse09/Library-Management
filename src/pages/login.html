<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LibraLink</title>
    <link rel="stylesheet" href="/styles/modern-base.css" />
    <link rel="stylesheet" href="/styles/styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="left">
        <div class="logo-container animate-fade-in-up">
          <img src="/images/LibraLinkLogo.png" alt="LibraLink Logo" class="logo" />
          <h1 class="logo-tagline">Your Digital Library Companion</h1>
        </div>
      </div>

      <div class="right">
        <div class="container animate-scale-in">
          <div class="auth-header">
            <h2 class="heading-2">Welcome Back</h2>
            <p class="text-muted">Sign in to your LibraLink account</p>
          </div>
          
          <form id="loginForm" class="auth-form">
            <div class="input-group">
              <label for="username" class="input-label">Username</label>
              <input 
                type="text" 
                id="username" 
                class="input" 
                placeholder="Enter your username" 
                required 
                autocomplete="username"
              />
            </div>
            
            <div class="input-group">
              <label for="password" class="input-label">Password</label>
              <input
                type="password"
                id="password"
                class="input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-full">
              <span>Sign In</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </form>
          
          <div class="auth-footer">
            <a href="/forgotPassword" class="auth-link">Forgot password?</a>
            <p class="text-muted text-center mt-6">
              Don't have an account? 
              <a href="/register" class="auth-link-primary">Create one</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          const now = new Date();
          const utc = now.getTime() + now.getTimezoneOffset() * 60000;
          const phTime = new Date(utc + 8 * 60 * 60000);
          const hour = phTime.getHours();

          // if (username.toLowerCase() !== "admin" && (hour >= 22 || hour < 5)) {
          //   alert("Logins are only allowed from 5AM to 10PM");
          //   return;
          // }

          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            credentials: "include",
          });

          const data = await response.json();
          if (response.ok) {
            localStorage.setItem("jwt", data.token);
            alert("Login successful!");
            window.location.href = "/userPage";
          } else {
            alert(data.message || "Login failed.");
          }
        });
    </script>
  </body>
</html>
