<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - LibraLink</title>
    <link rel="stylesheet" href="/styles/modern-base.css" />
    <link rel="stylesheet" href="/styles/dashboard.css" />
  </head>
  <body>
    <!-- Left Sidebar - Profile & Users -->
    <aside class="sidebar">
      <div class="sidebar-inside">
        <div class="sidebar-content">
          <!-- Profile Card -->
          <div class="profile-card card-glass">
            <div class="profile-avatar">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <h2 class="profile-name"><span id="username"></span></h2>
            <p class="profile-role">
              <span class="badge badge-primary" id="role"></span>
            </p>
          </div>

          <!-- Manage Users Section -->
          <div class="manage-users users-section">
            <h2 class="manage-title flex items-center gap-2">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              Manage Users
            </h2>
            <ul id="usersList" class="users-list"></ul>
          </div>
        </div>
        
        <button class="btn btn-ghost w-full logout-btn" id="logoutBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content - Feed -->
    <main class="main-content">
      <!-- Create Post Card -->
      <div id="createPostSection" class="create-post card">
        <div class="create-post-header">
          <h2 class="heading-3">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Create a Post
          </h2>
        </div>
        
        <div class="create-post-body">
          <div class="input-group">
            <input type="text" id="postTitle" class="input" placeholder="What's your post about?" />
          </div>
          
          <div class="input-group">
            <textarea
              id="postDescription"
              class="input"
              placeholder="Share your thoughts..."
              rows="4"
            ></textarea>
          </div>
          
          <div class="image-upload-area">
            <input type="file" id="postImage" accept="image/*" hidden />
            <label for="postImage" class="image-upload-label">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>Add Image</span>
            </label>
            <img id="imagePreview" class="image-preview" style="display: none;" />
          </div>
          
          <div class="post-buttons flex gap-3">
            <button class="btn btn-secondary flex-1" id="discardPost">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Discard
            </button>
            <button class="btn btn-primary flex-1" id="submitPost">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
              </svg>
              Post
            </button>
          </div>
        </div>
      </div>

      <!-- Posts Feed -->
      <div id="postsContainer" class="feed"></div>
    </main>

    <!-- Right Sidebar - Search & Info -->
    <aside class="right-section">
      <div class="search-container">
        <input
          type="text"
          id="searchBar"
          placeholder="Search posts..."
          class="input input-search"
        />
      </div>

      <div class="site-details card-glass">
        <h3 class="heading-4 mb-4">Settings</h3>
        <button class="btn btn-secondary w-full mb-4" id="toggleMode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          Dark Mode
        </button>
        
        <div class="site-info">
          <p class="text-sm text-muted">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle;">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Created by: Jomarie Esguerra
          </p>
          <p class="text-sm text-muted mt-2">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle;">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Build 03/10/2025
          </p>
        </div>
      </div>
    </aside>

    <script src="/scripts/dashboard.js"></script>
  </body>
</html>
