<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - LibraLink</title>
    <link rel="stylesheet" href="/styles/modern-base.css" />
    <link rel="stylesheet" href="/styles/styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="left">
        <div class="logo-container animate-fade-in-up">
          <img src="/images/LibraLinkLogo.png" alt="LibraLink Logo" class="logo" />
          <h1 class="logo-tagline">Create New Password</h1>
        </div>
      </div>

      <div class="right">
        <div class="container animate-scale-in">
          <div class="auth-header">
            <h2 class="heading-2">Reset Password</h2>
            <p class="text-muted">Choose a strong password for your account</p>
          </div>
          
          <form id="reset-password-form" class="auth-form">
            <div class="input-group">
              <label for="password" class="input-label">New Password</label>
              <input
                type="password"
                class="input"
                placeholder="Enter new password"
                name="password"
                id="password"
                required
              />
            </div>

            <div class="input-group">
              <label for="confirmPassword" class="input-label">Confirm Password</label>
              <input
                type="password"
                class="input"
                placeholder="Re-enter password"
                name="confirmPassword"
                id="confirmPassword"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-full" id="submit">
              <span>Reset Password</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
              </svg>
            </button>
            
            <button type="button" class="btn btn-secondary btn-lg w-full" id="cancel">
              <span>Cancel</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="/scripts/resetPassword.js"></script>
  </body>
</html>
